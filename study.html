<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Mode - My Melody Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <style>
  </style>
</head>

<body>

  <header>
    <div class="logo-container">
      <div class="my-melody-icon">
        <img src="/images/mymelodylogo.png" alt="my melody" width="65" height="65">
      </div>
      <h1 class="logo-text">My Melody Flashcards</h1>
    </div>
  </header>

  <nav>
    <div class="nav-container">
      <a href="mymelody.html" class="nav-link">Home</a>
      <a href="categories.html" class="nav-link">Browse Categories</a>
      <a href="create.html" class="nav-link">Create Flashcards</a>
      <a href="study.html" class="nav-link">Study Mode</a>
    </div>
  </nav>

  <main>
    <h2 class="section-title">Study Mode</h2>
    <h3 id="categoryTitle" class="category-title-simple" style="display:none;"></h3>

    <div class="study-controls">
      <div class="top-controls">
        <select id="categoryFilter" class="category-select">
          <option value="all">All Categories</option>
        </select>

        <input type="text" id="searchInput" class="category-select" placeholder="Search terms..." />

        <div class="buttons">
          <button class="btn" id="prevBtn">Previous</button>
          <button class="btn" id="shuffleBtn">Shuffle</button>
          <button class="btn" id="nextBtn">Next</button>
        </div>
      </div>

      <div class="progress-text" id="progressDisplay">Card 1 of 5</div>

      <div class="progress-instruction" style="font-size: 0.85rem; color: #666; margin-bottom: 4px;">
        Hover over the progress bar to see which card you'll jump to.
      </div>

      <!-- PROGRESS BAR -->
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar-fill" id="progressBar"></div>
        <div id="progressTooltip" class="progress-tooltip"
          style="display:none; position:absolute; pointer-events:none; padding: 4px 8px; background: var(--primary-dark); color: white; border-radius: 4px; font-size: 0.8rem; white-space: nowrap; transform: translate(-50%, -150%);">
        </div>
      </div>
    </div>

    <div class="flashcard-container">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front" id="flashcard-question">
          What is the capital of Japan?
        </div>
        <div class="flashcard-face flashcard-back" id="flashcard-answer">
          Tokyo
        </div>
      </div>
      <button id="deleteFlashcardBtn" class="btn" style="margin-top: 10px; background-color: #e74c3c; color: white;">Delete Flashcard</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 My Melody Flashcards. All rights reserved.</p>
    <div class="footer-links">
      <a href="#" class="footer-link">About</a>
      <a href="#" class="footer-link">Resources</a>
      <a href="#" class="footer-link">Contact</a>
    </div>
  </footer>

  <script>
    const flashcard = document.getElementById('flashcard');
    const flashcardQuestion = document.getElementById('flashcard-question');
    const flashcardAnswer = document.getElementById('flashcard-answer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const progressDisplay = document.getElementById('progressDisplay');
    const categoryFilter = document.getElementById('categoryFilter');
    const progressBar = document.getElementById('progressBar');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const progressTooltip = document.getElementById('progressTooltip');

    let flashcards = [];
    let currentIndex = 0;
    let currentDeck = [];

    // Load flashcards from localStorage and terms2.json
    function loadFlashcards() {
      let storedFlashcards = [];
      try {
        storedFlashcards = JSON.parse(localStorage.getItem('flashcards')) || [];
      } catch (e) {
        console.error('Error parsing flashcards from localStorage:', e);
      }

      fetch('terms2.json')
        .then(response => response.json())
        .then(data => {
          // Add category field if missing, default to 'uncategorized'
          const fileFlashcards = data.flashcards.map(card => ({
            question: card.term,
            answer: card.definition,
            category: card.category || 'uncategorized'
          }));

          // Combine stored flashcards and file flashcards
          flashcards = [...storedFlashcards, ...fileFlashcards];
          currentDeck = [...flashcards];
          updateFlashcard();
        })
        .catch(error => {
          console.error('Error loading flashcards:', error);
          // Use only stored flashcards if fetch fails
          flashcards = [...storedFlashcards];
          currentDeck = [...flashcards];
          updateFlashcard();
        });
    }

    function updateFlashcard() {
      if (currentDeck.length === 0) {
        flashcardQuestion.textContent = 'No flashcards available.';
        flashcardAnswer.textContent = '';
        progressDisplay.textContent = '';
        progressBar.style.width = '0%';
        return;
      }
      const card = currentDeck[currentIndex];
      flashcardQuestion.textContent = card.question;
      flashcardAnswer.textContent = card.answer;
      progressDisplay.textContent = `Card ${currentIndex + 1} of ${currentDeck.length}`;

      const progressPercent = ((currentIndex + 1) / currentDeck.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    flashcard.addEventListener('click', () => {
      flashcard.classList.toggle('flipped');
    });

    // Add click event listener to progress bar container for jumping to flashcards
    progressBarContainer.addEventListener('click', (event) => {
      if (currentDeck.length === 0) return;
      const rect = progressBarContainer.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const clickRatio = clickX / width;
      const newIndex = Math.floor(clickRatio * currentDeck.length);
      currentIndex = Math.min(newIndex, currentDeck.length - 1);
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    // Show tooltip on hover with card number
    progressBarContainer.addEventListener('mousemove', (event) => {
      if (currentDeck.length === 0) {
        progressTooltip.style.display = 'none';
        return;
      }
      const rect = progressBarContainer.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const width = rect.width;
      const hoverRatio = mouseX / width;
      let hoverIndex = Math.floor(hoverRatio * currentDeck.length);
      hoverIndex = Math.min(Math.max(hoverIndex, 0), currentDeck.length - 1);
      // Show short acronym or truncated question in tooltip
      let card = currentDeck[hoverIndex];
      let shortAcronym = card.question;
      if (shortAcronym.length > 15) {
        shortAcronym = shortAcronym.substring(0, 12) + '...';
      }
      progressTooltip.textContent = `${hoverIndex + 1}: ${shortAcronym}`;
      progressTooltip.style.left = `${mouseX}px`;
      progressTooltip.style.top = `0px`;
      progressTooltip.style.display = 'block';
    });

    progressBarContainer.addEventListener('mouseleave', () => {
      progressTooltip.style.display = 'none';
    });

    prevBtn.addEventListener('click', () => {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    nextBtn.addEventListener('click', () => {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % currentDeck.length;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    shuffleBtn.addEventListener('click', () => {
      for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
      }
      currentIndex = 0;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    // Add this event listener for category filtering
    categoryFilter.addEventListener('change', () => {
      filterFlashcards();
    });

    // Add event listener for search input
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      filterFlashcards();
    });

    // Function to filter flashcards by category and search term
    function filterFlashcards() {
      const selectedCategory = categoryFilter.value;
      const searchTerm = searchInput.value.toLowerCase();

      currentDeck = flashcards.filter(card => {
        const matchesCategory = selectedCategory === 'all' || card.category === selectedCategory;
        const matchesSearch = card.question.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      currentIndex = 0;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    }

    // Initialize flashcards on page load
    loadFlashcards();

    // Add delete flashcard functionality
    const deleteFlashcardBtn = document.getElementById('deleteFlashcardBtn');
    deleteFlashcardBtn.addEventListener('click', () => {
      if (flashcards.length === 0) {
        alert('No flashcards to delete.');
        return;
      }
      const cardToDelete = currentDeck[currentIndex];
      if (!cardToDelete) {
        alert('No flashcard selected.');
        return;
      }
      if (!confirm(`Are you sure you want to delete the flashcard: "${cardToDelete.question}"?`)) {
        return;
      }
      // Remove from flashcards array and localStorage
      flashcards = flashcards.filter(card => !(card.question === cardToDelete.question && card.answer === cardToDelete.answer && card.category === cardToDelete.category));
      let storedFlashcards = [];
      try {
        storedFlashcards = JSON.parse(localStorage.getItem('flashcards')) || [];
      } catch (e) {
        console.error('Error parsing flashcards from localStorage:', e);
      }
      storedFlashcards = storedFlashcards.filter(card => !(card.question === cardToDelete.question && card.answer === cardToDelete.answer && card.category === cardToDelete.category));
      localStorage.setItem('flashcards', JSON.stringify(storedFlashcards));
      // Update currentDeck based on filter and search
      filterFlashcards();
      // Adjust currentIndex if needed
      if (currentIndex >= currentDeck.length) {
        currentIndex = currentDeck.length - 1;
      }
      if (currentDeck.length === 0) {
        flashcardQuestion.textContent = 'No flashcards available.';
        flashcardAnswer.textContent = '';
        progressDisplay.textContent = '';
        progressBar.style.width = '0%';
      } else {
        updateFlashcard();
      }
      alert('Flashcard deleted successfully.');
    });

    // On page load, check URL for category query parameter and set filter
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryParam = urlParams.get('category');
      if (categoryParam) {
        categoryFilter.value = categoryParam;
        categoryFilter.dispatchEvent(new Event('change'));
        // Hide dropdown and show category title
        categoryFilter.style.display = 'none';
        const categoryTitle = document.getElementById('categoryTitle');
        categoryTitle.textContent = categoryParam;
        categoryTitle.style.display = 'block';
      }
    });
  </script>

</body>

</html>
