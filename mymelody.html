  <main>
    <section>
      <h2 class="section-title">Study Flashcards</h2>

        <select id="categoryFilter" class="category-select">
          <option value="all">All Categories</option>
          <option value="CompTIA A+ Core 1 Terms">CompTIA A+ Core 1 Terms</option>
          <option value="CompTIA A+ Core 2 Terms">CompTIA A+ Core 2 Terms</option>
          <option value="CompTIA Tech+ Terms">CompTIA Tech+ Terms</option>
          <option value="Cloud & Virtualization">Cloud & Virtualization</option>
        </select>
        <div class="buttons">
          <button class="btn" id="prevBtn">Previous</button>
          <button class="btn" id="shuffleBtn">Shuffle</button>
          <button class="btn" id="nextBtn">Next</button>
        </div>
      </div>
      <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
          <div class="flashcard-face flashcard-front" id="flashcard-question">

          <div class="flashcard-face flashcard-back" id="flashcard-answer">

        <button id="deleteFlashcardBtn" class="btn"

    <section>
      <h2 class="section-title">Create New Flashcard</h2>
      <div class="create-form">
        <form id="flashcard-form">
          <div class="form-group">
            <label for="question">Question:</label>
            <input type="text" id="question" class="form-control" placeholder="Enter your question" required>
          </div>
          <div class="form-group">
            <label for="answer">Answer:</label>
            <textarea id="answer" class="form-control" rows="3" placeholder="Enter your answer" required></textarea>
          </div>
          <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" class="form-control" required>
              <option value="">Select a category</option>
            </select>
          </div>
          <button type="submit" class="btn">Create Flashcard</button>
        </form>
      </div>
    </section>

    <section>
      <h2 class="section-title">Browse Categories</h2>
      <div>
        <input type="text" id="newCategoryInputHome" placeholder="Enter new category name" class="input-unified" />

      </div>
      <div class="categories-grid" id="categoriesGridHome">
        <!-- Categories will be rendered here dynamically -->
      </div>
    </section>

  <script>
    const flashcard = document.getElementById('flashcard');
    const flashcardQuestion = document.getElementById('flashcard-question');
    const flashcardAnswer = document.getElementById('flashcard-answer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const categoryFilter = document.getElementById('categoryFilter');

    let flashcards = [];
    let currentIndex = 0;
    let currentDeck = [];

    // Load flashcards from localStorage and terms2.json
    function loadFlashcards() {
      let storedFlashcards = [];
      try {
        storedFlashcards = JSON.parse(localStorage.getItem('flashcards')) || [];
      } catch (e) {
        console.error('Error parsing flashcards from localStorage:', e);
      }

      fetch('terms2.json')
        .then(response => response.json())
        .then(data => {
          // Add category field if missing, default to 'uncategorized'
          const fileFlashcards = data.flashcards.map(card => ({
            question: card.term,
            answer: card.definition,
            category: card.category || 'uncategorized'
          }));

          // Combine stored flashcards and file flashcards
          flashcards = [...storedFlashcards, ...fileFlashcards];
          currentDeck = [...flashcards];
          updateFlashcard();
        })
        .catch(error => {
          console.error('Error loading flashcards:', error);
          // Use only stored flashcards if fetch fails
          flashcards = [...storedFlashcards];
          currentDeck = [...flashcards];
          updateFlashcard();
        });
    }

    function updateFlashcard() {
      if (currentDeck.length === 0) {
        flashcardQuestion.textContent = 'No flashcards available.';
        flashcardAnswer.textContent = '';
        return;
      }
      const card = currentDeck[currentIndex];
      flashcardQuestion.textContent = card.question;
      flashcardAnswer.textContent = card.answer;
    }

    flashcard.addEventListener('click', () => {
      flashcard.classList.toggle('flipped');
    });

    prevBtn.addEventListener('click', () => {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    nextBtn.addEventListener('click', () => {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % currentDeck.length;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    shuffleBtn.addEventListener('click', () => {
      for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
      }
      currentIndex = 0;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    categoryFilter.addEventListener('change', () => {
      const selectedCategory = categoryFilter.value;
      if (selectedCategory === 'all') {
        currentDeck = [...flashcards];
      } else {
        currentDeck = flashcards.filter(card => card.category === selectedCategory);
      }
      currentIndex = 0;
      flashcard.classList.remove('flipped');
      updateFlashcard();
    });

    // Initialize flashcards on page load
    loadFlashcards();

    // Flashcard creation form submit handler
    const flashcardForm = document.getElementById('flashcard-form');
    flashcardForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const question = document.getElementById('question').value.trim();
      const answer = document.getElementById('answer').value.trim();
      const category = document.getElementById('category').value;

      if (question && answer && category) {
        let storedFlashcards = [];
        try {
          storedFlashcards = JSON.parse(localStorage.getItem('flashcards')) || [];
        } catch (e) {
          console.error('Error parsing flashcards from localStorage:', e);
        }

        storedFlashcards.push({ question, answer, category });
        localStorage.setItem('flashcards', JSON.stringify(storedFlashcards));

        alert('Flashcard created successfully!');
        flashcardForm.reset();
      } else {
        alert('Please fill all required fields.');
      }
    });

    // Categories management for home page
    const defaultCategoriesHome = [
      { name: "CompTIA A+ Core 1 Terms", count: 42 },
      { name: "CompTIA A+ Core 2 Terms", count: 126 },
      { name: "CompTIA Tech+ Terms", count: 35 },
      { name: "Cloud & Virtualization", count: 19 }
    ];

    function loadCategoriesHome() {
      let categories = JSON.parse(localStorage.getItem('categoriesHome'));
      if (!categories) {
        categories = defaultCategoriesHome;
        localStorage.setItem('categoriesHome', JSON.stringify(categories));
      }
      return categories;
    }

    function saveCategoriesHome(categories) {
      localStorage.setItem('categoriesHome', JSON.stringify(categories));
    }

    function renderCategoriesHome() {
      const categories = loadCategoriesHome();
      const grid = document.getElementById('categoriesGridHome');
      grid.innerHTML = '';
      categories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-card';
        div.innerHTML = `
          <div class="category-icon">🎀</div>
          <a href="study.html?category=${encodeURIComponent(cat.name)}" class="category-link">
            <h3>${cat.name}</h3>
          </a>
          <p>${cat.count} cards</p>
        `;
        grid.appendChild(div);
      });
    }

    document.getElementById('addCategoryBtnHome').addEventListener('click', () => {
      const input = document.getElementById('newCategoryInputHome');
      const newCategory = input.value.trim();
      if (!newCategory) {
        alert('Please enter a category name.');
        return;
      }
      let categories = loadCategoriesHome();
      if (categories.some(cat => cat.name.toLowerCase() === newCategory.toLowerCase())) {
        alert('Category already exists.');
        return;
      }
      categories.push({ name: newCategory, count: 0 });
      saveCategoriesHome(categories);
      renderCategoriesHome();
      input.value = '';
    });

    // Initial render
    renderCategoriesHome();

    // Dynamically populate the create flashcards category dropdown
    function populateCreateCategoryDropdown() {
      const categories = loadCategoriesHome();
      const categorySelect = document.getElementById('category');
      categorySelect.innerHTML = '<option value="">Select a category</option>';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.name;
        option.textContent = cat.name;
        categorySelect.appendChild(option);
      });
    }

    // Call initially and whenever categories change
    populateCreateCategoryDropdown();

    // Override renderCategoriesHome to also update the create category dropdown
    if (typeof originalRenderCategoriesHome === 'undefined') {
      var originalRenderCategoriesHome = renderCategoriesHome;
      renderCategoriesHome = function () {
        originalRenderCategoriesHome();
        populateCreateCategoryDropdown();
      };
    }
  </script>
