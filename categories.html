<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Categories - My Melody Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo-container">
      <div class="my-melody-icon">
        <img src="images/mymelodylogo.png" alt="My Melody Logo" width="65" height="65">
      </div>
      <h1 class="logo-text">My Melody Flashcards</h1>
    </div>
  </header>
  <nav>
    <div class="nav-container">
      <a href="mymelody.html" class="nav-link">Home</a>
      <a href="categories.html" class="nav-link">Browse Categories</a>
      <a href="create.html" class="nav-link">Create Flashcards</a>
      <a href="study.html" class="nav-link">Study Mode</a>
    </div>
  </nav>
  <main>
    <section>
      <h2 class="section-title">Browse Categories</h2>
      <div>
        <input type="text" id="newCategoryInput" placeholder="Enter new category name" class="input-unified" />
        <button id="addCategoryBtn" class="btn">Add Category</button>
      </div>
      <div class="categories-grid" id="categoriesGrid">
        <!-- Categories will be rendered here dynamically -->
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 My Melody Flashcards. All rights reserved.</p>
      <div class="footer-links">
        <a href="#" class="footer-link">About</a>
        <a href="#" class="footer-link">Resources</a>
        <a href="#" class="footer-link">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    // Default categories with counts
    const defaultCategories = [
      { name: "CompTIA A+ Core 1 Terms", count: 42 },
      { name: "CompTIA A+ Core 2 Terms", count: 126 },
      { name: "CompTIA Tech+ Terms", count: 35 },
      { name: "Cloud & Virtualization", count: 19 }
    ];

    // Load categories from localStorage or use default
    function loadCategories() {
      let categories = JSON.parse(localStorage.getItem('categories'));
      if (!categories) {
        categories = defaultCategories;
        localStorage.setItem('categories', JSON.stringify(categories));
      }
      return categories;
    }

    // Save categories to localStorage
    function saveCategories(categories) {
      localStorage.setItem('categories', JSON.stringify(categories));
    }

    // Render categories grid
    function renderCategories() {
      const categories = loadCategories();
      const grid = document.getElementById('categoriesGrid');
      grid.innerHTML = '';
      categories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-card';
        div.innerHTML = `
          <div class="category-icon">🎀</div>
          <a href="study.html?category=${encodeURIComponent(cat.name)}" class="category-link">
            <h3>${cat.name}</h3>
          </a>
          <p>${cat.count} cards</p>
        `;
        grid.appendChild(div);
      });
    }

    // Add new category
    document.getElementById('addCategoryBtn').addEventListener('click', () => {
      const input = document.getElementById('newCategoryInput');
      const newCategory = input.value.trim();
      if (!newCategory) {
        alert('Please enter a category name.');
        return;
      }
      let categories = loadCategories();
      if (categories.some(cat => cat.name.toLowerCase() === newCategory.toLowerCase())) {
        alert('Category already exists.');
        return;
      }
      categories.push({ name: newCategory, count: 0 });
      saveCategories(categories);
      renderCategories();
      input.value = '';
    });

    // Initial render
    renderCategories();
  </script>
</body>

</html>
